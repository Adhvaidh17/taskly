name: taskly_mobile
description: Taskly Flutter mobile app backed directly by Supabase PostgreSQL.
publish_to: none
version: 1.9.0+9

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  supabase_flutter: ^2.9.1
  intl: ^0.20.2
  uuid: ^4.5.1
  file_selector: ^1.1.0
  flutter_contacts: ^2.3.0
  crypto: ^3.0.7
  share_plus: ^13.3.0
  country_picker: ^2.0.28
  phone_numbers_parser: 9.0.25
  flutter_local_notifications: 18.0.1
  timezone: ^0.9.4
  shared_preferences: ^2.5.5
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  image_picker: ^1.2.3
  mime: ^2.0.0
  receive_sharing_intent: ^1.9.0
  url_launcher: ^6.3.2
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.0.0
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  http: ^1.6.0
  archive: ^4.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

dev_dependencies:
