name: Taskly local cache and UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('taskly_mobile/lib/providers/chat_provider.dart')
          s = p.read_text()
          start = s.index('      final serverLoaded =')
          end = s.index('      ConversationItem? selfChat;', start)
          replacement = '''      final serverLoaded = (await backend.conversations())
          .map(ConversationItem.fromJson)
          .toList();
      final localLoaded = (await _localDb.conversations())
          .map((row) => ConversationItem.fromJson({
                'channel_id': row['channel_id'],
                'workspace_id': row['workspace_id'],
                'kind': row['kind'],
                'name': row['title'],
                'avatar_url': row['avatar_url'],
                'last_message': row['last_message'],
                'last_sender_name': row['last_sender_name'],
                'last_message_at': row['last_message_at'],
                'unread_count': row['unread_count'],
                'is_muted': (row['muted'] as num? ?? 0).toInt() == 1,
                'is_archived': (row['archived'] as num? ?? 0).toInt() == 1,
              }))
          .toList();
      final serverIds = serverLoaded.map((item) => item.channelId).toSet();
      final loaded = <ConversationItem>[
        ...serverLoaded,
        ...localLoaded.where((item) => !serverIds.contains(item.channelId)),
      ];
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          p = Path('taskly_mobile/lib/services/chat_cache_service.dart')
          s = p.read_text()
          old = """    final conversations = <Map<String, dynamic>>[];
    final messages = <int, List<Map<String, dynamic>>>{};
    final prefix = '${_namespace}_';

    await for (final entity in root.list(followLinks: false)) {
      if (entity is! File) continue;
      final name = entity.uri.pathSegments.isEmpty ? entity.path : entity.uri.pathSegments.last;
      if (!name.startsWith(prefix) || !name.endsWith('.json')) continue;
"""
          new = """    final conversations = <Map<String, dynamic>>[];
    final messages = <int, List<Map<String, dynamic>>>{};
    final requestedPrefix = '${_namespace}_';
    var prefix = requestedPrefix;
    final allFiles = <File>[];
    await for (final entity in root.list(followLinks: false)) {
      if (entity is File && entity.path.endsWith('.json')) allFiles.add(entity);
    }
    final requestedFiles = allFiles.where((file) {
      final name = file.uri.pathSegments.isEmpty ? file.path : file.uri.pathSegments.last;
      return name.startsWith(requestedPrefix);
    }).toList();
    if (requestedFiles.isEmpty) {
      final candidates = <String>{};
      for (final file in allFiles) {
        final name = file.uri.pathSegments.isEmpty ? file.path : file.uri.pathSegments.last;
        final match = RegExp(r'^(.+)_conversations_v43\\.json$').firstMatch(name);
        if (match != null) candidates.add(match.group(1));
      }
      if (candidates.isNotEmpty) {
        String? newest;
        DateTime? newestTime;
        for (final candidate in candidates) {
          final file = File('${root.path}${Platform.pathSeparator}${candidate}_conversations_v43.json');
          final modified = await file.lastModified();
          if (newestTime == null || modified.isAfter(newestTime)) {
            newest = candidate;
            newestTime = modified;
          }
        }
        if (newest != null) prefix = '${newest}_';
      }
    }

    await for (final entity in root.list(followLinks: false)) {
      if (entity is! File) continue;
      final name = entity.uri.pathSegments.isEmpty ? entity.path : entity.uri.pathSegments.last;
      if (!name.startsWith(prefix) || !name.endsWith('.json')) continue;
"""
          if old not in s:
              raise SystemExit('cache recovery anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('taskly_mobile/lib/v62/new_chat_hub_v62.dart')
          s = p.read_text()
          s = s.replace("    return Scaffold(\n      body: AiUniverseShellV62(", "    return Scaffold(\n      backgroundColor: Theme.of(context).scaffoldBackgroundColor,\n      resizeToAvoidBottomInset: true,\n      body: AiUniverseShellV62(", 1)
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add taskly_mobile/lib/providers/chat_provider.dart taskly_mobile/lib/services/chat_cache_service.dart taskly_mobile/lib/v62/new_chat_hub_v62.dart
          git diff --cached --quiet || git commit -m 'Fix local-first chat cache and UI consistency'
          git push
