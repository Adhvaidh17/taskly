name: One-time cache sync fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch local cache refresh path
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('taskly_mobile/lib/local_chat/local_chat_database.dart')
          text = path.read_text()
          old = '''    // The .cache transcript is the hot path. SQLite remains the local index
    // and action/outbox store, but opening a chat must not wait for SQLite
    // reconstruction when the device already has its cached transcript.
    if (beforeLocalId == null) {
      final cached = await _chatCache.readMessages(channelId);
      if (cached.isNotEmpty) {
        final limited = cached.length <= limit
            ? cached
            : cached.sublist(cached.length - limit);
        return List<Map<String, dynamic>>.from(limited);
      }
    }
'''
          new = '''    // The JSON cache is the hot path. Only a tiny SQLite freshness probe is
    // performed so a newly received message can invalidate the cached view.
    // The full local transcript is never reconstructed unless the cache is
    // missing or stale.
    if (beforeLocalId == null) {
      final cached = await _chatCache.readMessages(channelId);
      if (cached.isNotEmpty) {
        final cachedNewest = _createdAt(cached.last);
        final dbNewestRows = await db.query(
          'local_messages',
          columns: ['created_at'],
          where: 'channel_id = ?',
          whereArgs: [channelId],
          orderBy: 'created_at DESC',
          limit: 1,
        );
        final dbNewest = dbNewestRows.isEmpty
            ? ''
            : '${dbNewestRows.first['created_at'] ?? ''}';
        if (dbNewest.isEmpty || dbNewest.compareTo(cachedNewest) <= 0) {
          final limited = cached.length <= limit
              ? cached
              : cached.sublist(cached.length - limit);
          return List<Map<String, dynamic>>.from(limited);
        }

        final freshRows = await db.query(
          'local_messages',
          where: 'channel_id = ?',
          whereArgs: [channelId],
          orderBy: 'id DESC',
          limit: limit,
        );
        final merged = <String, Map<String, dynamic>>{};
        for (final row in cached) {
          final key = '${row['client_message_id'] ?? row['id'] ?? ''}';
          if (key.isNotEmpty) merged[key] = Map<String, dynamic>.from(row);
        }
        for (final row in freshRows) {
          final converted = _legacyCompatibleRow(row);
          final key = '${converted['client_message_id'] ?? converted['id'] ?? ''}';
          if (key.isNotEmpty) merged[key] = converted;
        }
        final combined = merged.values.toList()
          ..sort((a, b) => _createdAt(a).compareTo(_createdAt(b)));
        await _chatCache.writeMessages(channelId, combined);
        final limited = combined.length <= limit
            ? combined
            : combined.sublist(combined.length - limit);
        return List<Map<String, dynamic>>.from(limited);
      }
    }
'''
          if old not in text:
              raise SystemExit('Expected cache hot-path block was not found')
          text = text.replace(old, new, 1)
          if '_createdAt(Map<String, dynamic>' not in text:
              marker = "  Future<List<Map<String, dynamic>>> mediaLinksDocs("
              helper = "  String _createdAt(Map<String, dynamic> row) => '${row['created_at'] ?? ''}';\n\n"
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one_time_cache_sync_fix.yml
          git add taskly_mobile/lib/local_chat/local_chat_database.dart .github/workflows/one_time_cache_sync_fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Keep chat cache hot while syncing new messages"
          git push
